[package]
name = "proofpoll-v1-4-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Sweettest for ProofPoll DNA v1.4 on a real Holochain 0.7.1 conductor"

# Its own workspace on purpose: the DNA workspace one level up builds for
# wasm32 and must never pull the conductor crate in.
[workspace]

[dependencies]
polls_integrity_v1_4 = { path = "../zomes/polls/integrity" }
polls_coordinator_v1_4 = { path = "../zomes/polls/coordinator" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
holochain = { version = "=0.7.1", features = ["test_utils"] }
holo_hash = { version = "0.7.1", features = ["encoding"] }
tokio = { version = "1", features = ["full"] }

[profile.dev]
debug = 0
