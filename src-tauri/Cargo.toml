[package]
name = "proofpoll"
version = "0.6.0-beta.3"
description = "ProofPoll - Verified polls with Flowsta identity linking"
authors = ["ProofPoll"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "~2.12.5", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["full"] }

# Lair keystore client API. Holochain 0.6.1 pins lair_keystore_api to exactly
# 0.6.3 — match it so the bundled lair-keystore binary (0.6.3) and this
# client can never drift.
lair_keystore_api = "=0.6.3"

# Holochain conductor client (AdminWebsocket + AppWebsocket). Conductor 0.6.1
# → Rust client 0.8.1 (released 2026-05-12 for Holochain 0.6.1).
holochain_client = { version = "=0.8.1", default-features = false }
holochain_types = "=0.6.1"

# Used by build_canonical_backup to dump + classify the full source chain
# (SourceChainDumpRecord, EntryType/Action) for the CAL §4.2.1 export. Already
# pulled in transitively by holochain_types 0.6.1; pinned to move in lockstep.
holochain_state_types = "=0.6.1"
holochain_integrity_types = "=0.6.1"

# The Holochain 0.7 line, beside the 0.6 line, for the transition release:
# the 0.6 crates read v1.0-v1.3 cells on the 0.6.1 conductor, the 0.7 crates
# read v1.4 on the 0.7.1 conductor. A Record from one line does not decode
# with the other; our own entry structs are msgpack and cross freely.
holochain_client_07 = { package = "holochain_client", version = "=0.9.1", default-features = false }
holochain_types_07 = { package = "holochain_types", version = "=0.7.1" }
holochain_integrity_types_07 = { package = "holochain_integrity_types", version = "=0.7.1" }
holochain_state_types_07 = { package = "holochain_state_types", version = "=0.7.1" }
# The 0.7 line's lair client: a conductor accepts only a lair of its own version,
# so the transition release runs two lairs and talks to each with its own client.
lair_keystore_api_07 = { package = "lair_keystore_api", version = "=0.7.1" }

# Error handling
thiserror = "1.0"

# Random passphrase generation
rand = "0.8"

# Msgpack decoding for entry types
rmp-serde = "1"

# Base64 for signature decoding
base64 = "0.22"

# Hex encoding for the unknown-entry-type fallback in decode_record_for_export,
# so the user still sees *something* in their Vault export per CAL §4.2.1.
hex = "0.4"
sha2 = "0.10"

# HTTP client for IPC notifications to Vault
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Percent-decode lair connection-URL paths so we match the actual filesystem
# path (matters on macOS where "Application Support" contains a space).
percent-encoding = "2"

# (libc dependency moved to the Unix-only target block below)

# Unix-only: process liveness check via `kill(pid, 0)` in
# `spawn_health_monitor`. Windows uses a stubbed check (see conductor.rs).
sysinfo = "0.33"

# The app's own updates: the updater plugin (Tauri's signature on the file)
# and the release manifest check (Team Flowsta's signature on the release).
tauri-plugin-updater = "~2.12.0"
flowsta-update-check = { git = "https://github.com/WeAreFlowsta/flowsta-update-check", rev = "1e892e20aa577a3ece65945b3d8f0fd4b95532f6" }
url = "2"

# The kit cache (and, from 0.5.2, the rest of the lines library): the same
# rev as Flowsta Vault; its Holochain client pins are ProofPoll's own.
async-trait = "0.1"
flowsta-hc-lines = { git = "https://github.com/WeAreFlowsta/flowsta-hc-lines", rev = "1a85ced1a0a62283b23e93e2ff3bde72fad7e676" }

# The test harness's localhost server (feature `harness`, test builds only).
axum = { version = "0.7", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
# Carried records (carried.rs): the checks a v1.5 validator runs, run
# before a record is carried, and the harness's proof check.
ed25519-dalek = "2.2"
holo_hash_07 = { package = "holo_hash", version = "=0.7.1", features = ["hashing"] }
serde_bytes = "0.11"
# The embedded WebDriver the UI suite drives (feature `e2e`, test builds only).
tauri-plugin-wdio-webdriver = { version = "1.4", optional = true }

[features]
# Test builds only (scripts/build-test-binary.sh), never a release build:
# scripts/check-test-features.mjs refuses them in the default features and
# in every workflow.
harness = ["dep:axum"]
e2e = ["harness", "dep:tauri-plugin-wdio-webdriver"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-only: the sidecars (lair-keystore.exe / holochain.exe) are spawned
# through CreateProcessW with their console window created hidden, tied to a
# kill-on-close Job Object so they die with the app, with a post-spawn
# EnumWindows + ShowWindow(SW_HIDE) sweep as the second line (see process_ext.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    # CreateJobObjectW takes a *const SECURITY_ATTRIBUTES (Win32_Security), and
    # JOBOBJECT_EXTENDED_LIMIT_INFORMATION embeds Threading::IO_COUNTERS.
    "Win32_Security",
    # CreateProcessW + STARTUPINFOW (hidden console) and the stdin pipe.
    "Win32_System_Threading",
    "Win32_System_Pipes",
] }

[dev-dependencies]
tempfile = "3"
