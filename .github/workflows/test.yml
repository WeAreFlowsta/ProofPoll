name: Tests

on:
  push:
    branches: [main, stable-channel-release, "proofpoll-*"]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "adapters/**"
      - "scripts/**"
      - "dna/v1.5/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "adapters/**"
      - "scripts/**"
      - "dna/v1.5/**"
      - ".github/workflows/test.yml"

jobs:
  # The pages: type-checked and built the way a release builds them. A vite
  # build alone does not type-check.
  front-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  rust-tests:
    # The same tests on each platform ProofPoll ships for: paths, sidecar
    # names and process handling differ between them.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The Tauri build script refuses to compile unless the sidecar binaries
      # (externalBin) and the front-end dist exist. Unit tests never spawn the
      # sidecars and never load the front end, so placeholders are enough
      # here; the release workflow fetches the real Holochain binaries.
      # bash on Windows too, for this step only.
      - name: Placeholder sidecars and front-end dist for the build script
        shell: bash
        run: |
          mkdir -p src-tauri/binaries dist
          triple=$(cd src-tauri && rustc -vV | sed -n 's/^host: //p')
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          for b in proofpoll-holochain proofpoll-holochain-06 proofpoll-lair-keystore proofpoll-lair-keystore-07; do
            f="src-tauri/binaries/$b-$triple$ext"
            [ -f "$f" ] || { printf '#!/bin/sh\nexit 0\n' > "$f"; chmod +x "$f"; }
          done

      # The bundled hApp files, the constants that name them and the kit
      # hashes must agree before anything is tagged.
      - name: Bundle-sync check
        if: runner.os == 'Linux'
        run: node scripts/check-bundle-sync.mjs

      # The installer's wait for the program file at an update, run for
      # real: the file is held for four seconds, as Windows can hold a
      # program that has just exited, and the installer must wait and then
      # write it. With no /UPDATE it must not wait.
      - name: Installer waits for the program file at an update
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src-tauri/windows
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress | Out-Null }
          & $makensis /V2 hook-test.nsi
          if ($LASTEXITCODE -ne 0) { throw "the installer hooks did not compile" }
          New-Item -ItemType Directory -Force hook-test-inst | Out-Null
          $target = Join-Path (Get-Location) "hook-test-inst\hook-target.exe"
          function Hold([int]$seconds) {
            Set-Content -Path $target -Value "old"
            Start-Job -ArgumentList $target, $seconds -ScriptBlock {
              param($path, $secs)
              $f = [IO.File]::Open($path, 'Open', 'ReadWrite', 'None')
              Start-Sleep -Seconds $secs
              $f.Close()
            } | Out-Null
            Start-Sleep -Seconds 1
          }
          Hold 4
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $run = Start-Process .\hook-test.exe -ArgumentList "/UPDATE" -Wait -PassThru
          $took = $clock.Elapsed.TotalSeconds
          "update: exit $($run.ExitCode) after $([math]::Round($took, 1)) s; the file holds '$(Get-Content $target)'"
          if ($run.ExitCode -ne 0) { throw "at an update the held program file was not written" }
          if ($took -lt 2) { throw "the installer did not wait for the held file" }
          if ((Get-Content $target) -ne "new") { throw "the program file was not replaced" }
          Get-Job | Wait-Job | Remove-Job
          Hold 4
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $run = Start-Process .\hook-test.exe -Wait -PassThru
          $took = $clock.Elapsed.TotalSeconds
          "by hand: exit $($run.ExitCode) after $([math]::Round($took, 1)) s"
          if ($took -gt 2) { throw "an install by hand was held up by the update wait" }
          if ($run.ExitCode -ne 3) { throw "expected the held file to refuse the write when nothing waits" }
          Get-Job | Wait-Job | Remove-Job

      - name: Run unit tests
        working-directory: src-tauri
        run: cargo test --lib

      # The test harness and the UI suite's WebDriver must build on every
      # platform too (test builds only; never a release).
      - name: Test-feature check
        working-directory: src-tauri
        run: cargo check --features e2e

      # Debug builds skip every #[cfg(not(debug_assertions))] arm; code used
      # only there rots invisibly. Compile those arms on every push instead.
      - name: Release-profile check
        working-directory: src-tauri
        run: cargo check --release

  # The network's write rules, on a real conductor: who may write a poll, a
  # vote, a flag or a carried record, and that a stranger's own coordinator
  # is refused. Run against the DNA inside the pack the app ships, never a
  # fresh build (a rebuild is another DNA hash, another network).
  write-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: The pack is the one the app pins
        run: |
          want=$(grep -o 'name: "proofpoll_v1_5_happ.happ", sha256: "[0-9a-f]*"' src-tauri/src/kits.rs | grep -o '[0-9a-f]\{64\}')
          have=$(sha256sum src-tauri/resources/proofpoll_v1_5_happ.happ | cut -d' ' -f1)
          echo "pinned $want"; echo "found  $have"
          [ -n "$want" ] && [ "$want" = "$have" ]

      - name: The DNA from the shipped pack
        run: node scripts/extract-shipped-dna.mjs src-tauri/resources/proofpoll_v1_5_happ.happ proofpoll_v1_5.dna dna/v1.5/workdir/proofpoll_v1_5.dna

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dna/v1.5/tests
            dna/v1.5/tests/hostile

      # A stranger's own coordinator beside the real integrity zome: two
      # tests load it. Test only, never bundled.
      - name: The stranger's coordinator
        working-directory: dna/v1.5/tests/hostile
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Write-rule tests
        working-directory: dna/v1.5/tests
        run: cargo test

