[package]
name = "proofpoll-carrier"
version = "0.1.0"
description = "Carries ProofPoll's public records from DNA v1.3 and v1.4 to v1.5, each with its proof"
license = "MIT"
edition = "2021"
publish = false

# Its own crate, so the node's binary carries no app or webview code: it
# compiles the app's record and client modules (`src-tauri/src/carried.rs`,
# `hc.rs`) by path, so both run the same checks.

[[bin]]
name = "proofpoll-carrier"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1"
serde_bytes = "0.11"
base64 = "0.22"
ed25519-dalek = "2.2"

# The app's pins, line for line: the 0.6 crates read v1.3 on the 0.6.1
# conductor, the 0.7 crates read v1.4 and write v1.5 on the 0.7.1 one.
holochain_client = { version = "=0.8.1", default-features = false }
holochain_types = "=0.6.1"
holochain_client_07 = { package = "holochain_client", version = "=0.9.1", default-features = false }
holochain_types_07 = { package = "holochain_types", version = "=0.7.1" }
holochain_integrity_types_07 = { package = "holochain_integrity_types", version = "=0.7.1" }
holo_hash_07 = { package = "holo_hash", version = "=0.7.1", features = ["hashing"] }

[dev-dependencies]
# carried.rs's tests read their fixtures as hex.
hex = "0.4"
